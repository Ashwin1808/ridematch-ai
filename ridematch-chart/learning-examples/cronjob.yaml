apiVersion: batch/v1
kind: CronJob

metadata:
  name: ridematch-scheduled-job
  namespace: ridematch

spec:
  schedule: "*/1 * * * *"

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: scheduled-task
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  echo "RideMatch scheduled task started"
                  date
                  echo "RideMatch scheduled task completed"

          restartPolicy: Never