apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: ridematch-backend
  namespace: monitoring
  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: Helm

  namespaceSelector:
    matchNames:
      - ridematch

  endpoints:
    - port: http
      path: /metrics
      interval: 15s