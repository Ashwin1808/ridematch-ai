apiVersion: v1

kind: Service

metadata:
  name: ridematch-backend-service
  namespace: ridematch

spec:

  selector:
    app: ridematch-backend

  # ports:
  #   - protocol: TCP
  #     # port: 5001
  #     port: {{ .Values.service.port }}
  #     # targetPort: 5001
  #     targetPort: {{ .Values.service.port }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}

  type: ClusterIP