metadata:
  name: ridematch-pod-reader-binding
  namespace: ridematch

subjects:
  - kind: ServiceAccount
    name: ridematch-backend-sa
    namespace: ridematch

roleRef:
  kind: Role
  name: ridematch-pod-reader
  apiGroup: rbac.authorization.k8s.io