apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ridematch-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: ridematch.rules

      rules:

      - alert: RideMatchBackendDown
        expr: up{job="ridematch-backend-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RideMatch backend is down"
          description: "Backend has not responded for more than one minute."

      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL exporter cannot connect to the database."

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80%."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes > 300000000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Memory Usage"
          description: "Memory usage exceeded 300 MB."