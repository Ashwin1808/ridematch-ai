name: Deploy RideMatch to EC2

on:
  workflow_run:
    workflows: ["RideMatch CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,POSTGRES_PASSWORD,JWT_SECRET,GEMINI_API_KEY,NEWS_API_KEY,GNEWS_API_KEY,DOCKER_USERNAME,DOCKER_PASSWORD

          script: |
            set -eu

            cd /home/ec2-user/ridematch-ai

            git pull origin main

            mkdir -p backend
            umask 077

            {
              printf 'PORT=5001\n'
              printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
              printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
              printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
              printf 'NEWS_API_KEY=%s\n' "$NEWS_API_KEY"
              printf 'GNEWS_API_KEY=%s\n' "$GNEWS_API_KEY"
            } > backend/.env

            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" > .env

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            docker compose pull

            docker compose up -d

            docker image prune -f