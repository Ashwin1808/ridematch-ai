name: RideMatch CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Build Backend
        working-directory: backend
        run: npm run build --if-present

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # - name: Build Backend Docker Image
      #   run: |
      #     docker build \
      #       -t ashwindocker1808/ridematch-backend:latest \
      #       ./backend
      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ashwindocker1808/ridematch-backend:${{ github.sha }} \
            -t ashwindocker1808/ridematch-backend:latest \
            ./backend

      - name: Push Backend Docker Image
        run: |
          docker push ashwindocker1808/ridematch-backend:${{ github.sha }}
          docker push ashwindocker1808/ridematch-backend:latest

    # Login already done above

      # - name: Build Frontend Docker Image
      #   run: |
      #     docker build \
      #       -t ashwindocker1808/ridematch-frontend:latest \
      #       ./frontend
      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ashwindocker1808/ridematch-frontend:${{ github.sha }} \
            -t ashwindocker1808/ridematch-frontend:latest \
            ./frontend

      - name: Push Frontend Docker Image
        run: |
          docker push ashwindocker1808/ridematch-frontend:${{ github.sha }}
          docker push ashwindocker1808/ridematch-frontend:latest