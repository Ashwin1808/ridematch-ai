name: RideMatch CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Backend Dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Cache Frontend Dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build --if-present

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Create terraform.tfvars
        run: |
          cat > infra/terraform/terraform.tfvars <<EOF
          db_password="${{ secrets.DB_PASSWORD }}"
          jwt_secret="${{ secrets.JWT_SECRET }}"
          gemini_api_key="${{ secrets.GEMINI_API_KEY }}"
          news_api_key="${{ secrets.NEWS_API_KEY }}"
          gnews_api_key="${{ secrets.GNEWS_API_KEY }}"
          EOF

      - name: Terraform Init
        working-directory: infra/terraform    
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ashwindocker1808/ridematch-backend:${{ github.sha }} \
            -t ashwindocker1808/ridematch-backend:latest \
            ./backend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ashwindocker1808/ridematch-backend:${{ github.sha }}
          format: template
          template: "@.github/trivy/html.tpl"
          output: backend-trivy-report.html
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Push Backend Docker Image
        run: |
          docker push ashwindocker1808/ridematch-backend:${{ github.sha }}
          docker push ashwindocker1808/ridematch-backend:latest

    # Login already done above

      # - name: Build Frontend Docker Image
      #   run: |
      #     docker build \
      #       -t ashwindocker1808/ridematch-frontend:latest \
      #       ./frontend
      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ashwindocker1808/ridematch-frontend:${{ github.sha }} \
            -t ashwindocker1808/ridematch-frontend:latest \
            ./frontend

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ashwindocker1808/ridematch-frontend:${{ github.sha }}
          format: template
          template: "@.github/trivy/html.tpl"
          output: frontend-trivy-report.html
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            backend-trivy-report.html
            frontend-trivy-report.html

      - name: Upload Sonar Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-report
          path: .scannerwork
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ashwin1808
            -Dsonar.projectKey=ridematch-ai
            -Dsonar.host.url=https://sonarcloud.io

      - name: Push Frontend Docker Image
        run: |
          docker push ashwindocker1808/ridematch-frontend:${{ github.sha }}
          docker push ashwindocker1808/ridematch-frontend:latest